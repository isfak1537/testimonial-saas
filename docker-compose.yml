# Local development and demo stack. All defaults are local-only development values;
# ports are bound to 127.0.0.1. Override them in .env (see .env.example).
name: testimonial-saas

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testimonial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testimonial_dev}
      POSTGRES_DB: ${POSTGRES_DB:-testimonial}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54320}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the Unix socket: on first boot the image runs a socket-only temporary server
      # for initialisation and then restarts, so a socket check can pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Throwaway database for integration tests (`pnpm db:test:up`). Data lives in tmpfs.
  db-test:
    image: postgres:16-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: testimonial
      POSTGRES_PASSWORD: testimonial_test
      POSTGRES_DB: testimonial_test
    ports:
      - "127.0.0.1:${DB_TEST_HOST_PORT:-54330}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U testimonial -d testimonial_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Required in production mode. Local compose serves http://localhost over plain http.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      SUBMISSION_RATE_LIMIT_MAX: ${SUBMISSION_RATE_LIMIT_MAX:-5}
      WALL_RATE_LIMIT_MAX: ${WALL_RATE_LIMIT_MAX:-120}
      FORM_RATE_LIMIT_MAX: ${FORM_RATE_LIMIT_MAX:-60}
      DATABASE_URL: postgresql://${POSTGRES_USER:-testimonial}:${POSTGRES_PASSWORD:-testimonial_dev}@db:5432/${POSTGRES_DB:-testimonial}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
